<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <!--@include head-->
    <title>منوی آناتومیک | STRATA تبریز</title>
    <meta name="description" content="منوی استراتا: هر نوشیدنی به‌صورت برشی از لیوان، با لایه‌ها و مقدارِ دقیقِ هر کدام." />
  </head>
  <body class="page-menu">
    <!--@include loader-->
    <!--@include header-->
    <main id="main">
      <header class="page-head container">
        <p class="kicker" data-reveal>منو <span aria-hidden="true">—</span> شمارهٔ ۰۱</p>
        <h1 class="display h1" data-split>آناتومیِ <em>هر نوشیدنی.</em></h1>
        <p class="lead" data-reveal style="--d: 0.25s">چهارده نوشیدنی، هر کدام برشی از همان لیوان. لایه‌ها را بخوان، مقدارها را ببین، و لیوان را برای هر کدام از نو بساز.</p>
      </header>

      <div class="container menu-layout">
        <aside class="menu-stage" aria-label="لیوانِ سه‌بعدی">
          <div class="menu-stage__inner">
            <div class="stage" data-scene="menu"><canvas data-bg="#e7e0d4" aria-hidden="true"></canvas></div>
            <div class="menu-stage__caption">
              <p><span class="kicker">در لیوان</span> <b data-current-name>لاته</b></p>
              <button class="link" type="button" data-explode aria-pressed="false">نمای انفجاری</button>
            </div>
          </div>
        </aside>

        <div class="menu-list">
          <div class="chips" role="group" aria-label="دسته‌بندی منو"><!--@render menuFilters--></div>
          <!--@render menu-->
          <p class="menu-note muted">مقدارها برای لیوانِ ۲۴۰ میلی‌لیتریِ خانه است. شیرِ گیاهی (جو دوسر، بادام) برای هر نوشیدنیِ شیری در دسترس است.</p>
        </div>
      </div>
    </main>
    <!--@include footer-->
    <script type="module" src="/src/js/menu.js"></script>
  </body>
</html>
