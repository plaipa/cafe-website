<footer class="site-footer">
  <div class="container site-footer__grid">
    <div class="site-footer__about">
      <a class="brand" href="./index.html">
        <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true">
          <g transform="rotate(-30 16 16)" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
            <ellipse cx="16" cy="16" rx="8.5" ry="12" />
            <path d="M16 4.5c-4 3.9-4 7 0 11.5s4 7.6 0 11.5" />
          </g>
        </svg>
        <span class="brand__name">{{brand}}</span>
      </a>
      <p>{{tagline}}</p>
    </div>

    <nav class="site-footer__col" aria-label="{{pages}}">
      <h2>{{pages}}</h2>
      <a href="./menu.html">{{menu}}</a>
      <a href="./science.html">{{science}}</a>
      <a href="./about.html">{{about}}</a>
      <a href="./contact.html">{{contact}}</a>
    </nav>

    <div class="site-footer__col">
      <h2>{{hours}}</h2>
      <p>{{hours1}}</p>
      <p>{{hours2}}</p>
    </div>

    <div class="site-footer__col">
      <h2>{{visit}}</h2>
      <p>{{address}}</p>
      <p><bdi>{{phone}}</bdi></p>
    </div>
  </div>
  <div class="container site-footer__legal">
    <span>{{legal}}</span>
    <a class="lang-switch lang-switch--plain" href="{{alt}}" hreflang="{{altLang}}" lang="{{altLang}}" data-lang-switch="{{altLang}}">{{switchTo}}</a>
  </div>
</footer>
