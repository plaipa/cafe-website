<footer class="site-footer">
  <div class="container site-footer__grid">
    <div class="site-footer__about">
      <a class="brand" href="./index.html" aria-label="{{brand}}">
        <span class="wordmark" aria-hidden="true"><b>code</b><span>concept</span></span>
      </a>
      <p>{{tagline}}</p>
      <p class="slogan" lang="en" dir="ltr">This place runs on code.</p>
    </div>

    <nav class="site-footer__col" aria-label="{{pages}}">
      <h2>{{pages}}</h2>
      <a href="./menu.html">{{menu}}</a>
      <a href="./science.html">{{science}}</a>
      <a href="./about.html">{{about}}</a>
      <a href="./contact.html">{{contact}}</a>
    </nav>

    <div class="site-footer__col">
      <h2>{{hours}}</h2>
      <p>{{hours1}}</p>
      <p>{{hours2}}</p>
    </div>

    <div class="site-footer__col">
      <h2>{{visit}}</h2>
      <p>{{address}}</p>
      <p><bdi>{{phone}}</bdi></p>
    </div>
  </div>
  <div class="container site-footer__legal">
    <span>{{legal}}</span>
    <a class="lang-switch lang-switch--plain" href="{{alt}}" hreflang="{{altLang}}" lang="{{altLang}}" data-lang-switch="{{altLang}}">{{switchTo}}</a>
  </div>
</footer>
