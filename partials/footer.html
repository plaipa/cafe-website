<footer class="site-footer">
  <div class="container site-footer__grid">
    <div class="site-footer__about">
      <p>{{tagline}}</p>
    </div>

    <nav class="site-footer__col" aria-label="{{pages}}">
      <h2>{{pages}}</h2>
      <a href="./index.html">{{home}}</a>
      <a href="./menu.html">{{menu}}</a>
      <a href="./about.html">{{about}}</a>
      <a href="./contact.html">{{contact}}</a>
    </nav>

    <div class="site-footer__col">
      <h2>{{hours}}</h2>
      <p>{{hours1}}</p>
      <p>{{hours2}}</p>
    </div>

    <div class="site-footer__col">
      <h2>{{visit}}</h2>
      <p>{{address}}</p>
      <p><bdi>{{phone}}</bdi></p>
    </div>
  </div>
  <p class="site-footer__mast" aria-hidden="true">STRATA</p>
  <div class="container site-footer__legal">
    <span>{{legal}}</span>
    <a class="lang-switch lang-switch--plain" href="{{alt}}" hreflang="{{altLang}}" lang="{{altLang}}" data-lang-switch="{{altLang}}">{{switchTo}}</a>
  </div>
</footer>
