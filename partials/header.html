<a class="skip-link" href="#main">{{skip}}</a>
<header class="site-header" id="site-header">
  <div class="site-header__bar">
    <a class="brand" href="./index.html" aria-label="{{homeLabel}}">
      <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true">
        <g transform="rotate(-30 16 16)" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <ellipse cx="16" cy="16" rx="8.5" ry="12" />
          <path d="M16 4.5c-4 3.9-4 7 0 11.5s4 7.6 0 11.5" />
        </g>
      </svg>
      <span class="brand__name">{{brand}}</span>
      <span class="brand__city">{{city}}</span>
    </a>

    <nav class="nav" id="site-nav" aria-label="{{navLabel}}">
      <a href="./index.html" data-nav="index">{{home}}</a>
      <a href="./menu.html" data-nav="menu">{{menu}}</a>
      <a href="./science.html" data-nav="science">{{science}}</a>
      <a href="./about.html" data-nav="about">{{about}}</a>
      <a href="./contact.html" data-nav="contact">{{contact}}</a>
    </nav>

    <div class="site-header__end">
      <a class="lang-switch" href="{{alt}}" hreflang="{{altLang}}" lang="{{altLang}}" aria-label="{{switchLabel}}" data-lang-switch="{{altLang}}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="9" /><path d="M3 12h18M12 3c2.6 2.6 3.8 5.6 3.8 9s-1.2 6.4-3.8 9c-2.6-2.6-3.8-5.6-3.8-9S9.4 5.6 12 3z" /></svg>
        <span>{{switchTo}}</span>
      </a>
      <a class="btn btn--small header-cta" href="./contact.html#reserve">{{reserve}}</a>
      <button class="nav-toggle" type="button" aria-controls="site-nav" aria-expanded="false" aria-label="{{toggle}}">
        <span></span><span></span>
      </button>
    </div>
  </div>
</header>
