<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <!--@include head-->
    <title>The anatomical menu | STRATA Tabriz</title>
    <meta name="description" content="The STRATA menu: every drink drawn as a cross-section of the glass, with its layers and exact amounts." />
  </head>
  <body class="page-menu">
    <!--@include loader-->
    <!--@include header-->
    <main id="main">
      <header class="page-head container">
        <p class="kicker" data-reveal>Menu <span aria-hidden="true">—</span> Issue 01</p>
        <h1 class="display h1" data-split>The anatomy <em>of every drink.</em></h1>
        <p class="lead" data-reveal style="--d: 0.25s">Fourteen drinks, each a section through the same glass. Read the layers, see the amounts, and build the glass again for any of them.</p>
      </header>

      <div class="container menu-layout">
        <aside class="menu-stage" aria-label="The drink in section">
          <div class="menu-stage__inner">
            <div class="stage stage--figure" data-figure><!--@render figure--></div>
            <div class="menu-stage__caption">
              <p><span class="kicker">In the glass</span> <b data-current-name>Latte</b></p>
              <button class="link" type="button" data-explode aria-pressed="false">Exploded view</button>
            </div>
          </div>
        </aside>

        <div class="menu-list">
          <div class="chips" role="group" aria-label="Menu categories"><!--@render menuFilters--></div>
          <!--@render menu-->
          <p class="menu-note muted">Amounts are for the house 240 ml glass. Oat or almond milk is available for any milk drink.</p>
        </div>
      </div>
    </main>
    <!--@include footer-->
    <script type="module" src="/src/js/menu.js"></script>
  </body>
</html>
